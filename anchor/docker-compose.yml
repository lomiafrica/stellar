# Official Anchor Platform next to the lab. Not inside apps/api.
# From apps/tools/stellar: docker compose -f anchor/docker-compose.yml up
# SEP10_SIGNING_SEED must come from the environment. Never commit a dummy seed.
services:
  lab:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3456:3456"
    environment:
      PORT: "3456"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3456}
      STELLAR_NETWORK: testnet
      SEP10_SIGNING_SEED: ${SEP10_SIGNING_SEED:-}
      SEP10_SIGNING_PUBLIC_KEY: ${SEP10_SIGNING_PUBLIC_KEY:-}
      SEP12_ACCEPTED_ACCOUNTS: ${SEP12_ACCEPTED_ACCOUNTS:-}
      LOMI_MERCHANT_VERIFY_URL: ${LOMI_MERCHANT_VERIFY_URL:-}
    env_file:
      - ../.env

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  anchor-platform:
    image: stellar/anchor-platform:4.8.0
    command: ["--sep-server"]
    depends_on:
      lab:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      STELLAR_ANCHOR_CONFIG: /config/anchor-config.yaml
      HOME_DOMAIN: ${HOME_DOMAIN:-localhost}
      LAB_BASE_URL: ${LAB_BASE_URL:-http://lab:3456}
      XOF_ISSUER: ${XOF_ISSUER:-GD6PH2FAK5DQFFFALZVAT337R7NDGSPWT4R6UBGA5GYLL7N5U4C4GI7I}
      SEP10_JWT_SECRET: ${SEP10_JWT_SECRET}
      SEP10_SIGNING_SEED: ${SEP10_SIGNING_SEED}
      CALLBACK_AUTH_SECRET: ${CALLBACK_AUTH_SECRET}
      DATA_TYPE: postgres
      DATA_SERVER: postgres:5432
      DATA_DATABASE: platform
      DATA_FLYWAY_ENABLED: "true"
      SECRET_DATA_USERNAME: platform
      SECRET_DATA_PASSWORD: platform
      SEP10_WEB_AUTH_DOMAIN: localhost:8080
    volumes:
      - ./config:/config:ro
