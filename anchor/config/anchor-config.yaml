# Anchor Platform 4.8.0 uses config schema v1 (no v2 schema on the image).
# SEP-1 toml is served by the lab on HOME_DOMAIN.
version: 1
stellar_network:
  network: TESTNET
  type: TESTNET
sep_server:
  port: 8080
callback_api:
  base_url: https://lab-production-5fac.up.railway.app/anchor
  auth:
    type: none
data:
  type: postgres
  server: postgres:5432
  database: platform
  flyway_enabled: true
sep1:
  enabled: false
sep6:
  enabled: true
sep10:
  enabled: true
  home_domains: lab-production-5fac.up.railway.app
  web_auth_domain: anchor-production-5059.up.railway.app
  client_attribution_required: false
sep12:
  enabled: true
sep24:
  enabled: true
  interactive_url:
    base_url: https://lab-production-5fac.up.railway.app/anchor/sep24
    jwt_expiration: 3600
sep31:
  enabled: true
sep38:
  enabled: true
assets:
  type: file
  value: /config/assets.yaml
