# Anchor Platform 4.8.0 uses config schema v1 (no v2 schema on the image).
# SEP-1 toml is served by the lab on HOME_DOMAIN.
version: 1
stellar_network:
  network: TESTNET
  type: horizon
  horizon_url: https://horizon-testnet.stellar.org
sep_server:
  port: 8080
platform_server:
  port: 8085
platform_api:
  base_url: http://localhost:8085
  auth:
    type: api_key
callback_api:
  base_url: https://lab-production-5fac.up.railway.app/anchor
  auth:
    type: api_key
data:
  type: postgres
  server: postgres:5432
  database: platform
  flyway_enabled: true
sep1:
  enabled: false
sep6:
  enabled: false
sep10:
  enabled: true
  home_domains: lab-production-5fac.up.railway.app
  web_auth_domain: anchor-production-5059.up.railway.app
  client_attribution_required: false
sep12:
  enabled: true
sep24:
  enabled: true
  interactive_url:
    base_url: https://lab-production-5fac.up.railway.app/anchor/sep24/interactive
    jwt_expiration: 3600
  more_info_url:
    base_url: https://lab-production-5fac.up.railway.app/anchor/sep24/more_info
    jwt_expiration: 3600
sep31:
  enabled: false
sep38:
  enabled: false
assets:
  type: file
  value: /config/assets.yaml
